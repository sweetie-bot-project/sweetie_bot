hardware:
    battery_monitor:
        period: 2.0
        sysfs_path: '/sys/class/power_supply/BAT0'
    joystick:
        sysfs_path: '/dev/input/js0'
    external_button:
        sysfs_path: '/dev/ttyUSB0'

# Servos physically out of service (hardware fault). SINGLE SOURCE OF TRUTH, consumed by:
#  - motion_core.lua -> kinematics_inv: joint PINNED at `positions` in the IK bounds
#    (controllers never command or rely on it - prevents the head-dive grind)
#  - SOAR herkulex_servos input module: unioned into ignore_joints (no failed/off/overheat WMEs)
#  - LLM state_collector (agent state view): excluded from fault/overheat reporting
# `positions` = the joint's REAL resting angle in rad (read /joint_states on the robot; for a
# torque-off/free servo use the settled angle - see llm_session_consolidated_2026-07-03.md).
disabled_servos:
    head_joint1: 0.0
