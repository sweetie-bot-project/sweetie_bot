            # start_event_history_with_heard) belong ONLY to the legacy CompleteRaw
            # backend, preserved as one-flag-away rollback config. The AGENT backend
            # reads: requests.<name>.{profile, persona, text_language, max_events,
            # max_predicates} (the caps are LIVE on the agent path now) + timeout.
            requests:
                'complex-en':
#L                  prompt_header_name: "complex-en"
#L                  prompt_fact_templates:
#L                      'talk-heard': [ "Human says \"{text}\"\n"  ]
#L                      'talk-said': [ "Sweetie says \"{text}\"\n" ]
