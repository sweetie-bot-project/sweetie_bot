soar:
    update_period: 0.2
    autostart: false
    reconfiguration_attempts: 0
    exit_on_configuration_failed: True   # P16: exit on params race; launch respawns a fresh process (SWM guard is per-process)
    agent_package: "sweetie_bot_soar"
    agent_file: "soar/unified-proto3.soar"
    #agent_file: "soar/tests/test_lookat.soar"
    #agent_file: "soar/tests/test_attention.soar"
    input:
        rand:
            type: "rand"
        clock:
            type: "clock"
            just_delay: 15.0
            recently_delay: 120.0
            long_time_delay: 3600.0
        joystick:
            type: "joystick"
            topic: "/hmi/joy_decoder/keys_pressed"
            last_activity_bins_map: { names: [ "now", "recently", "long-time" ], values: [ 10.0, 300.0] }
        touch:
            type: "joystick"
            topic: "/touch"
            last_activity_bins_map: { names: [ "now", "recently", "long-time" ], values: [ 3.0, 30.0 ] }
        swm:
            type: "swm"
            topic: "detections"
            visibility_timeout: 2
            memorize_time: 600
            world_frame: "odom_combined"
            camera_frame: "camera_link_optical"
            body_frame: "base_link"
            head_frame: "head_link4"
            eyes_frame: "eyes_link_yaw"
            horizontal_field_of_view: 60 # from 112.2 deg
            vertical_field_of_view: 50 # from 90.2 deg
            distance_bins_map: { names: [ "close", "near", "far" ], values: [ 0.3, 3.0] }
            yaw_bins_map: { names: [ "back", "right", "center", "left", "back" ], values: [ -1.57, -0.90, 0.90, 1.57] }   # center widened 0.52->0.90 while neck yaw (servo 1) is disabled: looking-at must assert without head yaw or dialogue wedges (P19); restore 0.52 when the servo is back
            time_bins_map: { names: [ "now", "just", "recently", "long-time" ], values: [ 2.0, 10.0, 120.0] }
            pose_filter:
              # type: 'none'
              type: 'maxvel'
              velocity_estimator_difftime: 0.1
              velocity_linear_threshold: 0.01   # 1 cm/s
              velocity_angular_threshold: 0.087 # 5 deg/s
              motion_ns: 'motion'
              sensor_kinematic_chain: 'head'
            markers_topic: '/hmi/swm_markers'
            markers_publication_period: 0.2
        head:
            type: "pose_joints"
            topic: "joint_states"
            storage_ns: "saved_msgs"
            pose_list: [ "head_nominal" ]
            tolerance: 0.174 # 10 degrees
            time_bins_map: { names: [ "just", "recently", "long-time" ], values: [ 10.0, 60.0 ] }
            movement_detection_joints: [ 'head_joint1', 'head_joint2', 'head_joint3', 'head_joint4' ]
            movement_detection_velocity_threshold: 0.1
        head-tf:
            type: "pose_tf"
            target_frame: "microphone_link"
            base_frame: "base_link"
            inclination_bins_map: { names: [ "vertical", "tilted", "strong-tilted" ], values: [ 15.0, 45.0 ] } # degrees
            heading_bins_map: { names: [ "strong-left", "left", "forward", "right", "strong-right" ], values: [ -45.0, -15.0, 15.0, 45.0 ] } # degrees
            time_bins_map: { names: [ "just", "recently", "long-time" ], values: [ 10.0, 60.0 ] }
        body:
            type: "pose_joints"
            topic: "joint_states"
            storage_ns: "saved_msgs"
            pose_list: [ "body_nominal", "body_walk", "body_zero", "body_zero_crouched", "body_crouched" ]
            tolerance: 0.174 # 10 degrees
            time_bins_map: { names: [ "just", "recently", "long-time" ], values: [ 10.0, 60.0 ] }
            movement_detection_joints: [ 'leg1_joint1', 'leg1_joint2', 'leg1_joint3', 'leg1_joint4', 'leg1_joint5', 'leg1_joint6',
                      'leg2_joint1', 'leg2_joint2', 'leg2_joint3', 'leg2_joint4', 'leg2_joint5', 'leg2_joint6',
                      'leg3_joint1', 'leg3_joint2', 'leg3_joint3', 'leg3_joint4', 'leg3_joint5', 'leg3_joint6',
                      'leg4_joint1', 'leg4_joint2', 'leg4_joint3', 'leg4_joint4', 'leg4_joint5', 'leg4_joint6' ]
            movement_detection_velocity_threshold: 0.1
        battery:
            type: "battery"
            topic: "battery_state"
            level_bins_map: { names: [ "critical", "low", "normal" ], values: [ 3.0, 15.0 ] }
        servos:
            type: "herkulex_servos"
            topic: "motion/herkulex/servo_states"
            overheat_temperature: 80.0
            ignore_joints: [ 'ear_r_joint', 'ear_l_joint', 'mouth_joint' ]
            groups:
              head: [ 'head_joint1', 'head_joint2', 'head_joint3', 'head_joint4' ]
              body: [ 'leg1_joint1', 'leg1_joint2', 'leg1_joint3', 'leg1_joint4', 'leg1_joint5', 'leg1_joint6',
                      'leg2_joint1', 'leg2_joint2', 'leg2_joint3', 'leg2_joint4', 'leg2_joint5', 'leg2_joint6',
                      'leg3_joint1', 'leg3_joint2', 'leg3_joint3', 'leg3_joint4', 'leg3_joint5', 'leg3_joint6',
                      'leg4_joint1', 'leg4_joint2', 'leg4_joint3', 'leg4_joint4', 'leg4_joint5', 'leg4_joint6' ]
        sound:
            type: "sound_speech"
            topic: "sound_event"
            speech_timeout: 2.5
            intensity_bins_map: { names: [ "low", "medium", "high" ], values: [ 0.3, 0.6 ] }
            lang_filter: ['en', 'ru', 'zh']
            object_filter: ['human']
            object_max_n: 3
            object_evaluation_alpha: 0.85
            undetected_angle_tolerance: 0.5 # +/- 30 deg
            undetected_intensity_accept_ratio: 0.90
            nlp_parsers:
                'en':
                    type: 'word_map'
                    nlp_model: 'en_core_web_sm'
                    map: 
                        greeting: [hello, hi, greet]
                        goodbye: [goodbye, bye]
                        dance: [dance]
                        sing: [sing]
                        please: [please]
                        give: [give]
                        hoof: [hoof, hand, leg, hooves]
                'ru':
                    type: 'word_map'
                    nlp_model: 'en_core_web_sm'
                    map:
                        greeting: [hello, hi, greet]
                        goodbye: [goodbye, bye]
                        dance: [dance]
                        sing: [sing]
                        please: [please]
                        give: [give]
                        hoof: [hoof, hand, leg, hooves]
                'zh':
                    type: 'word_map'
                    nlp_model: 'en_core_web_sm'
                    map: 
                        greeting: [hello, hi, greet]
                        goodbye: [goodbye, bye]
                        dance: [dance]
                        sing: [sing]
                        please: [please]
                        give: [give]
                        hoof: [hoof, hand, leg, hooves]
    output:
        nop:
            type: nop
            delay: 0.2
        textcmd: 
            type: textcmd
            topic: "control"
        flexbe:
            type: 'flexbe'
            action_ns: "flexbe/flexbe/execute_behavior"
        text-action:
            type: 'text-action'
            action_ns: "voice/syn"
            # LLM rephrase interceptor: canned rule phrases are occasionally rephrased in
            # character (generic dilution, all say paths; LLM replies always pass verbatim)
            llm_rephrase:
                probability: 0.4
                timeout: 3.0
                action_ns: "generate_reply"
                profile: "rephrase-en"
        speech-visualization:
            type: 'speech-visualization'
            topic: "hmi/speech_visualization"
        look-at:
            type: 'look-at'
            controller: "motion/controller/look_at"
            period: 0.1
            # safety gate (output-module level; live incident 2026-07-02: unreachable off-axis
            # target with neck yaw disabled ground the head pitch into its joint limits)
            safe_cone:
                reference_frame: "base_link"
                max_yaw: 0.12           # rad: NEAR-CENTER ONLY - with a dead neck joint the controller grinds reachable axes chasing any lateral offset (live incidents x2)
                min_distance: 0.35      # m: closer targets fold the head down into the body
                low_z: -0.05            # m: targets below this AND closer than low_z_distance
                low_z_distance: 0.7     #    are head-into-body poses - rejected
        lang-model:
            type: 'lang-model'
            backend: agent
            service_ns: "llm_request"
            requests:
                'complex-en':
                    prompt_header_name: "complex-en"
                    prompt_fact_templates:
                        'talk-heard': [ "Human says \"{text}\"\n"  ]
                        'talk-said': [ "Sweetie says \"{text}\"\n" ]
                        'talk-ignored': [ "Human didn't answer.\n" ]
                        'talk-no-answer': [ "Human says nothing.\n" ]
                        'talk-illegible': [ "Human says something illegible.\n" ]
                    max_events: 5
                    max_predicates: 5
                    llm_profile_name: 'en'
                    attrib_requests:
                        - type: 'map'
                          nlp_model: 'en_core_web_sm'
                          map:
                            love: [ 'love' ]
                            joy: [ 'joy', 'happy', 'happiness' ]
                            surprise: [ 'surprise' ]
                            neutral: [ 'neutral', 'indifference', 'nothing', 'none' ]
                            sadness: [ 'sad', 'sadness' ]
                            fear: [ 'fear', 'scared', 'scary', 'fright' ]
                            anger: [ 'anger', 'angry', 'mad', 'unhappy', 'fury', 'furious' ]
                          attrib: 'emotion'
                          fallback_value: 'neutral'
                          prompt: "Sweetie thinks about human's answer and the emotion she feels is "
                          leading_text: "The emotion Sweetie feels is "
                          stop_list: ['.', '!', "\n"]
                        - type: 'classification'
                          classification_model: 'bert_sentiment'
                          attrib: 'additional_emotion'
                          override_attrib: 'emotion'
                          fallback_value: 'neutral'
                          leading_text: ''
                          merge_map:
                            love: [ 'love' ]
                            joy: [ 'neutral', 'joy', ]
                            surprise: [ 'neutral', 'surprise' ]
                            neutral: [ 'neutral', 'surprise', 'fear', 'sadness' ]
                            sadness: [ 'neutral', 'sadness', ]
                            fear: [ 'neutral', 'fear' ]
                            anger: [ 'anger' ]
                        - type: 'regex'
                          regex: '(?P<result>[^"]+)"'
                          prompt: 'Sweetie says "'
                          stop_list: ["\n", "\\n"]
                        - type: 'regex-test'
                          regex: ".*\\?.*"
                          attrib: 'sentence-type'
                          value_match: 'question'
                          value_nomatch: 'statement'
                          stop_list: ["\n"]
                'simple-en':
                    # P1 fix: SOAR tries simple-en FIRST for every verbolization (priority 3)
                    # and the structured agent never fails to parse, so - unlike the legacy
                    # regex path, whose parse failures escalated conversation to complex-en -
                    # every turn would stay on the constrained simple profile. Map it to the
                    # rich conversational profile instead (tools on, no tight token cap).
                    profile: 'complex-en'
                    prompt_header_name: "simple-en"
                    prompt_fact_templates:
                        'talk-heard': [ "Human: {text}\n\r"  ]
                        'talk-said': [ "My emotion: {emotion} | Sweetie Bot: {text}\n\r\n\r" ]
                        'talk-ignored': [ "Human: Human didn't answer.\n\r", "Human: Human stays silent.\n\r", "Human: Human continues to stay silent.\n\r" ]
                        'talk-no-answer': [ "Human: Human stays silent.\n\r", "Human: Human continues to stay silent.\n\r" ]
                        'talk-illegible': [ "Human: Answer not recognized.\n\r" ]
                    max_events: 6
                    max_predicates: 0
                    start_event_history_with_heard: true
                    llm_profile_name: 'en'
                    attrib_requests:
                        - type: 'regex'
                          prompt: "My emotion: "
                          #regex: '\s*(?P<emotion_raw>\w+)\s*[|;]\s*Sweetie Bot: (?P<result>.*)'
                          regex: '[^|]*\|\s*[Ss]weetie\s+[Bb]ot:\s*(?P<result>.*)'
                          stop_list: ["\n"]
                        - type: 'map'
                          nlp_model: 'en_core_web_sm'
                          attrib: 'emotion'
                          fallback_value: 'neutral'
                          leading_text: ''
                          map:
                            love: [ 'love' ]
                            joy: [ 'joy', 'happy', 'happiness' ]
                            surprise: [ 'surprise' ]
                            neutral: [ 'neutral', 'indifference', 'nothing', 'none' ]
                            sadness: [ 'sad', 'sadness' ]
                            fear: [ 'fear', 'scared', 'scary', 'fright' ]
                            anger: [ 'anger', 'angry', 'mad', 'unhappy', 'fury', 'furious' ]
                        - type: 'classification'
                          classification_model: 'bert_sentiment'
                          attrib: 'additional_emotion'
                          override_attrib: 'additional_emotion'
                          fallback_value: 'neutral'
                          leading_text: ''
                          merge_map:
                            love: [ 'love' ]
                            joy: [ 'neutral', 'joy', ]
                            surprise: [ 'neutral', 'surprise' ]
                            neutral: [ 'neutral', 'surprise', 'fear', 'sadness' ]
                            sadness: [ 'neutral', 'sadness', ]
                            fear: [ 'neutral', 'fear' ]
                            anger: [ 'angry', 'anger', 'mad', 'unhappy' ]
                        - type: 'regex-test'
                          regex: ".*\\?.*"
                          attrib: 'sentence-type'
                          value_match: 'question'
                          value_nomatch: 'statement'
                'failsafe-en':
                    prompt_header_name: "failsafe-en"
                    prompt_fact_templates:
                        'talk-heard': [ "Human: {text}\n\r"  ]
                        'talk-said': [ "My emotion: {emotion} | Sweetie Bot: {text}\n\r\n\r" ]
                        'talk-ignored': [ "Human: Human didn't answer.\n\r", "Human: Human stays silent.\n\r", "Human: Human continues to stay silent.\n\r" ]
                        'talk-no-answer': [ "Human: Human stays silent.\n\r", "Human: Human continues to stay silent.\n\r" ]
                        'talk-illegible': [ "Human: Answer not recognized.\n\r" ]
                    max_events: 2
                    max_predicates: 0
                    start_event_history_with_heard: true
                    llm_profile_name: 'en'
                    attrib_requests:
                        - type: 'regex'
                          prompt: "My emotion: "
                          #regex: '\s*(?P<emotion_raw>\w+)\s*[|;]\s*Sweetie Bot: (?P<result>.*)'
                          regex: '[^|]*\|\s*[Ss]weetie\s+[Bb]ot:\s*(?P<result>.*)'
                          stop_list: ["\n"]
                        - type: 'map'
                          nlp_model: 'en_core_web_sm'
                          attrib: 'emotion'
                          fallback_value: 'neutral'
                          leading_text: ''
                          map:
                            love: [ 'love' ]
                            joy: [ 'joy', 'happy', 'happiness' ]
                            surprise: [ 'surprise' ]
                            neutral: [ 'neutral', 'indifference', 'nothing', 'none' ]
                            sadness: [ 'sad', 'sadness' ]
                            fear: [ 'fear', 'scared', 'scary', 'fright' ]
                            anger: [ 'anger', 'angry', 'mad', 'unhappy', 'fury', 'furious' ]
                        - type: 'regex-test'
                          regex: ".*\\?.*"
                          attrib: 'sentence-type'
                          value_match: 'question'
                          value_nomatch: 'statement'
