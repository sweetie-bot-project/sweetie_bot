vision:
    camera_matrix: [    375,      0,  400,
                         0,     375,  300,
                         0,       0,    1, ]
    apply_undistortion: true
    distortion_coefficients: [ 0.501383, 0.0370812, -7.27019e-05, -0.000171416, -4.35192e-06, 0.852262, 0.137816, 0.00259195, 0, 0, 0, 0, 0, 0, ]

# vision_proxy (C++ federation proxy): remote heavy/depth provider tier over wss.
# Loaded by proto32/load_param.launch (which already loads this vision.yaml) into the
# /vision_proxy node's private params. Empty remote_host => local-only.
vision_proxy:
    # VARIABLE number of remote provider containers — the system distributes over all of them (server,
    # a second laptop, ...). The local loopback container is separate (provider_host/port). Each remote
    # is an independent async tier; add/remove entries freely (no code change). Tokens are SECRETS read
    # at runtime from the env var named by `token_env` (never committed) — each container generates and
    # prints its own token on first start (run_provider). tls:true => wss (verify cert unless insecure).
    remotes:
      - host: "ws.sweetie.bot"      # heavy/server tier: edge terminates TLS, routes to the swai VM :8080
        port: 443
        tls: true
        insecure: false
        token_env: "VISION_API_KEY"
      # Example — a second laptop on the LAN (self-signed wss, its own token). Uncomment + adjust:
      # - host: "192.168.3.50"
      #   port: 8443
      #   tls: true
      #   insecure: true
      #   token_env: "VISION_API_KEY_LAPTOP2"

    # entity-type mapping applied at the ROS boundary (SOAR taxonomy; vision.soar keys a person
    # on 'human', the plushie on 'pony'). Core/wire types stay raw (dataset rig unaffected).
    type_map:
        face: human
        pony_body: pony
